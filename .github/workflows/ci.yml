name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-linux:
    name: Test (Linux + FUSE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install FUSE
        run: sudo apt-get install -y fuse libfuse-dev

      - name: Test
        run: go test ./... -race -count=1

      - name: Build
        run: go build ./cmd/agentfs/...

  test-macos:
    name: Test (macOS, unit only)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./... -race -count=1

      - name: Build
        run: go build ./cmd/agentfs/...
